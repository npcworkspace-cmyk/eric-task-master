name: cross-platform-release-gate

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows or macOS
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run release gate with a visible-browser display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run check
        env:
          TASKMASTER_ACCEPTANCE_REPORT: ${{ github.workspace }}/artifacts/acceptance.json
          TASKMASTER_COMMERCIAL_REPORT: ${{ github.workspace }}/artifacts/commercial.json
          TASKMASTER_ACCEPTANCE_PERSISTENT_ENGINE: chrome
      - name: Run release gate
        if: runner.os != 'Linux'
        run: npm run check
        env:
          TASKMASTER_ACCEPTANCE_REPORT: ${{ github.workspace }}/artifacts/acceptance.json
          TASKMASTER_COMMERCIAL_REPORT: ${{ github.workspace }}/artifacts/commercial.json
          TASKMASTER_ACCEPTANCE_PERSISTENT_ENGINE: chrome
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskmaster-${{ runner.os }}-node-${{ matrix.node }}
          path: artifacts
          if-no-files-found: ignore
