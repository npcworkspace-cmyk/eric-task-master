name: publish-tested-native-installers

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact release commit with successful main push CI and CodeQL; new publication requires current main
        required: true
        type: string
      confirm_version:
        description: Exact semantic version without the v prefix
        required: true
        type: string
      confirm_unsigned:
        description: Publish clearly marked unsigned Windows and macOS packages
        required: true
        type: boolean
      confirm_immutable:
        description: Confirm Release immutability is enabled
        required: true
        type: boolean
      verify_existing:
        description: Read-only verification of an existing immutable Release; never publish or modify it
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: native-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.verify_existing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_VERSION: ${{ inputs.confirm_version }}
      CONFIRM_UNSIGNED: ${{ inputs.confirm_unsigned }}
      CONFIRM_IMMUTABLE: ${{ inputs.confirm_immutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Verify exact main SHA, version, CI, CodeQL, and immutable Release policy
        shell: bash
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONFIRM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "${CONFIRM_UNSIGNED}" = true
          test "${CONFIRM_IMMUTABLE}" = true
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" = "${CONFIRM_VERSION}"

          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "${MAIN_SHA}" = "${RELEASE_SHA}" || { echo "Release SHA is not current main" >&2; exit 1; }
          TAG="v${CONFIRM_VERSION}"
          ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || {
            echo "Release ${TAG} already exists" >&2; exit 1;
          }
          ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1 || {
            echo "Tag ${TAG} already exists" >&2; exit 1;
          }
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | node scripts/assert-release-version.mjs "${CONFIRM_VERSION}"

          CI_RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id' \
            | head -n 1)"
          test -n "${CI_RUN_ID}" || { echo "No successful exact-SHA main CI run" >&2; exit 1; }
          CODEQL_RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id' \
            | head -n 1)"
          test -n "${CODEQL_RUN_ID}" || { echo "No successful exact-SHA main CodeQL run" >&2; exit 1; }
          test -n "${RELEASE_ADMIN_TOKEN}" || { echo "RELEASE_ADMIN_TOKEN is required" >&2; exit 1; }
          IMMUTABLE="$(GH_TOKEN="${RELEASE_ADMIN_TOKEN}" gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)"
          test "${IMMUTABLE}" = true || { echo "Release immutability is not enabled" >&2; exit 1; }
          printf '%s\n' "TAG=${TAG}" "CI_RUN_ID=${CI_RUN_ID}" "CODEQL_RUN_ID=${CODEQL_RUN_ID}" >> "${GITHUB_ENV}"
      - name: Download the exact installer bytes tested by CI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloaded
          gh run download "${CI_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern 'release-*' --dir downloaded
          node scripts/build/collect-release-assets.mjs \
            --input downloaded --output dist --version "${CONFIRM_VERSION}" --sha "${RELEASE_SHA}"
      - name: Build the versioned Agent Skill archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_MTIME="@$(git show -s --format=%ct "${RELEASE_SHA}")"
          PREFIX="eric-task-master-skill-v${CONFIRM_VERSION}/"
          git archive --format=zip --mtime="${ARCHIVE_MTIME}" --prefix="${PREFIX}" \
            --output="dist/eric-task-master-skill-v${CONFIRM_VERSION}.zip" HEAD:skills/eric-task-master
          unzip -Z1 "dist/eric-task-master-skill-v${CONFIRM_VERSION}.zip" | grep -Fx "${PREFIX}SKILL.md"
          node scripts/build/checksums.mjs --dir dist --output dist/SHA256SUMS
      - name: Reverify main, exact CI, CodeQL, and immutable policy before publication
        shell: bash
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" \
            --jq '.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"')" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CODEQL_RUN_ID}" \
            --jq '.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"')" = true
          test "$(GH_TOKEN="${RELEASE_ADMIN_TOKEN}" gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)" = true
      - name: Publish one immutable unsigned Release
        shell: bash
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" \
            --jq '.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"')" = true
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CODEQL_RUN_ID}" \
            --jq '.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"')" = true
          test "$(GH_TOKEN="${RELEASE_ADMIN_TOKEN}" gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)" = true
          ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1
          ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1
          gh release create "${TAG}" dist/* \
            --draft \
            --target "${RELEASE_SHA}" \
            --title "Eric Task Master ${TAG}" \
            --generate-notes \
            --notes "Native packages are unsigned; verify SHA256SUMS and read UNSIGNED-BUILD.txt before installation." \
            --repo "${GITHUB_REPOSITORY}"
          gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)" = "${RELEASE_SHA}"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)" = true

  verify-existing:
    if: ${{ inputs.verify_existing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_VERSION: ${{ inputs.confirm_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Verify existing immutable tag and its original main push evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONFIRM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git -C release-source rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('release-source/package.json','utf8')).version")" = "${CONFIRM_VERSION}"
          TAG="v${CONFIRM_VERSION}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)" = "${RELEASE_SHA}"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.tag_name == "'"${TAG}"'" and .draft == false and .immutable == true')" = true
          CI_RUN_ID="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id' \
            | awk 'NR == 1 { print }')"
          test -n "${CI_RUN_ID}" || { echo "No successful exact-SHA main CI run" >&2; exit 1; }
          CODEQL_RUN_ID="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id' \
            | awk 'NR == 1 { print }')"
          test -n "${CODEQL_RUN_ID}" || { echo "No successful exact-SHA main CodeQL run" >&2; exit 1; }
          printf '%s\n' "TAG=${TAG}" "CI_RUN_ID=${CI_RUN_ID}" "CODEQL_RUN_ID=${CODEQL_RUN_ID}" >> "${GITHUB_ENV}"
      - name: Reassemble original CI bytes and deterministic Skill archive
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          gh run download "${CI_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --pattern 'release-*' --dir downloaded
          node scripts/build/collect-release-assets.mjs \
            --input downloaded --output dist --version "${CONFIRM_VERSION}" --sha "${RELEASE_SHA}"
          ARCHIVE_MTIME="@$(git show -s --format=%ct "${RELEASE_SHA}")"
          PREFIX="eric-task-master-skill-v${CONFIRM_VERSION}/"
          git archive --format=zip --mtime="${ARCHIVE_MTIME}" --prefix="${PREFIX}" \
            --output="dist/eric-task-master-skill-v${CONFIRM_VERSION}.zip" HEAD:skills/eric-task-master
          unzip -Z1 "dist/eric-task-master-skill-v${CONFIRM_VERSION}.zip" | grep -Fx "${PREFIX}SKILL.md"
          node scripts/build/checksums.mjs --dir dist --output dist/SHA256SUMS
      - name: Compare every published asset with the original tested bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir published
          node scripts/build/verify-release-assets.mjs --expected release-source/dist --published published
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)" = "${RELEASE_SHA}"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft == false and .immutable == true')" = true
          for RUN_ID in "${CI_RUN_ID}" "${CODEQL_RUN_ID}"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.head_sha == "'"${RELEASE_SHA}"'" and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"')" = true
          done
          printf 'Verified existing immutable %s at %s: every asset matches original main-push CI and deterministic Skill bytes.\n' \
            "${TAG}" "${RELEASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
