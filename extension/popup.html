<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eric Task Master</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="mark" aria-hidden="true">◉</div>
        <div>
          <h1>Task Master</h1>
          <p>Playwright 控制面板</p>
        </div>
        <span id="connection-dot" class="dot disconnected" title="Manager 未连接"></span>
      </header>

      <section class="card connection-card" aria-labelledby="connection-title">
        <div class="section-heading">
          <h2 id="connection-title">Manager</h2>
          <span id="connection-label" class="quiet">正在发现</span>
        </div>
        <label for="manager-origin">本机地址</label>
        <div class="inline">
          <input id="manager-origin" type="url" spellcheck="false" value="http://127.0.0.1:19946">
          <button id="save-origin" class="secondary" type="button">保存</button>
        </div>
        <div class="inline actions">
          <button id="discover-manager" class="secondary grow" type="button">重新发现</button>
          <button id="pair-extension" class="primary grow" type="button">配对</button>
        </div>
      </section>

      <section id="workspace" class="card hidden" aria-labelledby="profile-title">
        <div class="section-heading">
          <h2 id="profile-title">Playwright Profiles</h2>
          <button id="refresh-profiles" class="icon-button" type="button" title="刷新">↻</button>
        </div>
        <div class="inline">
          <input id="new-profile-name" type="text" maxlength="60" placeholder="新 Profile 名称">
          <select id="new-profile-mode" aria-label="新 Profile 默认行为">
            <option value="fast">快速</option>
            <option value="human">拟人</option>
            <option value="adaptive">自适应</option>
          </select>
          <label class="checkbox-label" title="不显示 Playwright 浏览器窗口">
            <input id="new-profile-headless" type="checkbox">
            后台
          </label>
          <button id="create-profile" class="primary" type="button">创建</button>
        </div>
        <div id="profile-list" class="profile-list" aria-live="polite"></div>
      </section>

      <section id="session-card" class="card hidden" aria-labelledby="session-title">
        <div class="section-heading">
          <h2 id="session-title">同步当前网站登录态</h2>
          <span id="current-origin" class="origin quiet">不可用</span>
        </div>
        <label for="session-profile">目标 Profile</label>
        <select id="session-profile"></select>
        <p class="notice">仅在你点击按钮后读取当前网站的 Cookie 与 LocalStorage，并直接发送给本机 Manager；不会展示或保存其内容。</p>
        <button id="sync-session" class="primary full" type="button">授权并同步当前网站</button>
      </section>

      <button id="open-dashboard" class="dashboard-button hidden" type="button">打开任务 Dashboard ↗</button>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
